<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOHO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ece8e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SOHO">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#ece8e6;--side:#e3dedb;--card:#f8f4f3;--inp:#fffcfb;--well:#e3dedb;--text:#2b2928;--muted:#9a9591;--line:#e5dfdc;--hover:#efebe9;--accent:#1b3b66;--accent-bg:#e3e8f0;--onacc:#fff;--btn:linear-gradient(180deg,#4a4643,#2b2928);--onbtn:#fff;--orange:#f57a1f;--danger:#c93a2e;--danger-bg:#f6e1de;--ok:#2e7d5b;--warn:#b85a16;--warn-bg:#fbe8d8;--shadow:0 1px 0 rgba(255,255,255,.95) inset,0 6px 18px rgba(80,65,55,.07);--shadow-lg:0 10px 28px rgba(50,40,35,.2);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1817;--side:#2f2c2a;--card:#252221;--inp:#1a1817;--well:#2f2c2a;--text:#f0ece9;--muted:#a39d98;--line:#35312f;--hover:#2c2927;--accent:#9db8e3;--accent-bg:#22314a;--onacc:#0d1b30;--btn:#f0ece9;--onbtn:#1f1d1c;--orange:#ff8a3a;--danger:#f28b82;--danger-bg:#3b2523;--ok:#7fcba0;--warn:#f2a265;--warn-bg:#3a2a1e;--shadow:0 6px 18px rgba(0,0,0,.35);--shadow-lg:0 10px 28px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1817;--side:#2f2c2a;--card:#252221;--inp:#1a1817;--well:#2f2c2a;--text:#f0ece9;--muted:#a39d98;--line:#35312f;--hover:#2c2927;--accent:#9db8e3;--accent-bg:#22314a;--onacc:#0d1b30;--btn:#f0ece9;--onbtn:#1f1d1c;--orange:#ff8a3a;--danger:#f28b82;--danger-bg:#3b2523;--ok:#7fcba0;--warn:#f2a265;--warn-bg:#3a2a1e;--shadow:0 6px 18px rgba(0,0,0,.35);--shadow-lg:0 10px 28px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;align-self:start;height:100vh}
.brand{font-weight:600;padding:4px 10px 16px;font-size:15px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--hover);color:var(--text);font-weight:600}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted)}
main{padding:40px clamp(16px,5vw,64px) 64px;max-width:1040px;width:100%}
h1{font-size:28px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 28px}
h2{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .c{font-weight:400;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.od{border-color:transparent;background:var(--danger-bg)}
.card.od h2{color:var(--danger)}
.sec{margin:0 0 24px}
.item{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:8px}
.item:hover{background:var(--hover)}
.chk{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--muted);background:transparent;cursor:pointer;flex:none;margin-top:2px;padding:0;display:grid;place-items:center;color:transparent}
.chk svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.item.done .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.main{flex:1;min-width:0}
.t{overflow-wrap:anywhere}
.m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m .late{color:var(--danger);font-weight:600}
.m .today{color:var(--accent);font-weight:600}
.tag{font-size:11.5px;padding:0 7px;border-radius:6px;background:var(--hover)}
.tag.high{background:var(--danger-bg);color:var(--danger)}
.tag.mid{background:var(--accent-bg);color:var(--accent)}
.acts{display:flex;gap:2px;opacity:0}
.item:hover .acts,.item:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.ib{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 7px;border-radius:6px;font-size:13px}
.ib:hover{background:var(--line);color:var(--text)}
.empty{color:var(--muted);padding:6px;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.day{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px;background:var(--card)}
.day .dn{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.day .dn b{display:block;font-size:20px;color:var(--text);font-weight:500;line-height:1.2}
.ev{font-size:12.5px;padding:3px 7px;border-radius:6px;margin-bottom:4px;background:var(--accent-bg);color:var(--accent);overflow-wrap:anywhere}
.ev.r{background:var(--warn-bg);color:var(--warn)}
.ev.dn2{text-decoration:line-through;opacity:.55}
.ev small{display:block;opacity:.8}
form.add{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
form.add input[type=text]{flex:1 1 220px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:var(--onacc);border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:8px;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--hover);color:var(--text);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-size:19px;font-weight:600}
.stat.wait b{color:var(--warn)}.stat.ok b{color:var(--ok)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:16px;min-width:120px;justify-content:center}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:68vh}
table.inc{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.inc th,.inc td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:right;white-space:nowrap}
.inc th{position:sticky;top:0;background:var(--side);padding:8px 12px;font-weight:600;font-size:13px;z-index:2}
.inc td:first-child,.inc th:first-child{position:sticky;left:0;text-align:left;background:var(--side);z-index:1}
.inc th:first-child{z-index:3}
.inc td:first-child{padding:6px 12px;color:var(--muted)}
.inc tr.we td:first-child{color:var(--danger)}
.inc tr.td td:not(.wsum){background:var(--accent-bg)}
.inc tr.td td:first-child{color:var(--accent);font-weight:600}
.cell{display:block;width:100%;min-width:118px;min-height:34px;padding:6px 12px;border:0;background:none;cursor:pointer;text-align:right;border-radius:0}
.cell:hover{background:var(--hover)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.sum{padding:6px 12px!important;font-weight:600}
.inc td.wsum{padding:6px 12px;font-weight:600;background:var(--hover);text-align:center;vertical-align:middle}
.inc tfoot td{position:sticky;bottom:0;background:var(--side);font-weight:600;padding:8px 12px;z-index:2;border-bottom:0}
.inc tfoot td:first-child{z-index:3;color:var(--text)}
.goal{margin:0 0 12px}
.gl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.gb{height:8px;border-radius:6px;background:var(--hover);overflow:hidden}
.gb i{display:block;height:100%;background:var(--accent);border-radius:6px}
.inc th.xo{color:var(--danger)}
.inc td.wsum small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:24px}
.tpl{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0;overflow:hidden;text-align:left;cursor:pointer;display:block}
.tpl:hover{border-color:var(--accent)}
.tpl .th{display:block;height:120px;width:100%;background:var(--side);padding:8px;border:0;cursor:pointer}
.tpl .th svg{width:100%;height:100%}
.tpl .tn{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:13.5px}
.mbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mbar input[type=text]{font-weight:600;min-width:140px}
.mv{position:relative;height:66vh;min-height:360px;border:1px solid var(--line);border-radius:12px;background:var(--card) radial-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px;overflow:hidden;touch-action:none;cursor:grab}
.mv.pan{cursor:grabbing}
.mc{position:absolute;left:0;top:0;transform-origin:0 0}
.mml{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--bg));font-size:14px;cursor:pointer;user-select:none;white-space:nowrap}
.mn span{overflow:hidden;text-overflow:ellipsis;padding:0 10px}
.mn.rt{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600;font-size:15px;border-radius:12px}
.mn.sel{outline:2px solid var(--accent);outline-offset:2px}
.mn input{width:calc(100% - 8px);border:0;background:transparent;text-align:center;padding:0;outline:0;color:inherit;font:inherit}
.fc{position:absolute;right:-10px;top:-9px;font-style:normal;font-size:11px;background:var(--text);color:var(--bg);border-radius:9px;padding:0 5px}
.nt{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;min-height:60vh}
.nl{border-right:1px solid var(--line);display:flex;flex-direction:column;max-height:72vh;min-width:0}
.nbar{display:flex;gap:6px;padding:10px}.nbar input{flex:1}
.ntags{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 8px}
.ntags button{border:0;background:var(--hover);border-radius:14px;padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.ntags button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
#nlist{overflow:auto;padding:0 6px 8px}
.ni{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer}
.ni:hover,.ni.on{background:var(--hover)}
.ni b{display:block;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ni small{display:block;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px}
.ne{display:flex;flex-direction:column;padding:14px 18px;gap:8px;min-width:0}
.ne textarea{flex:1;min-height:300px;resize:none;border:0;background:transparent;outline:0;font:inherit;line-height:1.6;padding:0;color:inherit}
.etop{display:flex;gap:2px;align-items:center}
.ne #ntag{max-width:240px}
.back{display:none}
@media (max-width:760px){.nt{grid-template-columns:1fr}.nt:not(.open) .ne{display:none}.nt.open .nl{display:none}.back{display:inline-block}}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:50}
.md{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto}
.md h3{margin:0 0 2px;font-size:17px}
.md .f{display:grid;gap:8px;margin-top:14px}
.md .mu{color:var(--muted);font-size:13px;margin:0 0 12px}
.det{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.det .r1{display:flex;gap:8px;align-items:center}
.det .am{font-weight:600;font-size:16px}
button.tag{border:0;cursor:pointer;padding:1px 8px}
.tag.ok{background:var(--hover);color:var(--ok)}.tag.wait{background:var(--hover);color:var(--warn)}
@media (max-width:760px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
.app{grid-template-columns:1fr}
.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
.brand{display:none}
.nav{display:flex;gap:4px;overflow-x:auto}
.nav a{white-space:nowrap;margin:0}
.nav .n{display:none}
main{padding-top:24px}
.grid{grid-template-columns:1fr}
h1{font-size:24px}}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}

.fab svg,.acc svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.acc[hidden]{display:none}
.acc:hover{background:var(--hover)}

.item{border-radius:14px}

main{padding:56px 16px calc(112px + env(safe-area-inset-bottom,0px))}
input,select,textarea{font-size:16px}
.ib{min-height:36px;padding:4px 10px}
.btn{min-height:40px}
.cell{min-height:44px}}
</style>
</head>
<body>

<script>
const KEY='viec-ca-nhan-v1';
let S={tasks:[],rem:[]},view='dashboard',filter='all',edit=null,ym=null,M=null;
const VIEWS={'dashboard':'Dashboard','cong-viec':'Công việc','thu-nhap':'Thu nhập','nhac-viec':'Nhắc việc','ghi-chu':'Ghi chú nhanh','mindmap':'Mindmap'};
const ICON={'ghi-chu':'<path d="M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h5"/>','mindmap':'<circle cx="12" cy="12" r="2.5"/><circle cx="4.5" cy="6" r="1.8"/><circle cx="19.5" cy="6" r="1.8"/><circle cx="4.5" cy="18" r="1.8"/><circle cx="19.5" cy="18" r="1.8"/><path d="M10 11 6 7M14 11l4-4M10 13l-4 4M14 13l4 4"/>','thu-nhap':'<path d="M3 7h18v12H3zM3 11h18M7 15h3"/>','dashboard':'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z"/>','cong-viec':'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>','nhac-viec':'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/>'};
const CHECK='<svg viewBox="0 0 12 12"><path d="m2 6.5 3 3 5-6"/></svg>';
const WD=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const WDS=['CN','T2','T3','T4','T5','T6','T7'];
const PRI={high:'Cao',mid:'Vừa',low:'Thấp'};
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const cmp=(a,b)=>(a.date+(a.time||'99:99')).localeCompare(b.date+(b.time||'99:99'));

function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);S.inc=S.inc?fixInc(S.inc):defInc();save();return}}catch(e){}
const t=today();
S={tasks:[
{id:uid(),title:'Viết báo cáo tuần',date:t,time:'10:00',pri:'high',done:false},
{id:uid(),title:'Đặt lịch khám răng',date:t,time:'',pri:'mid',done:false},
{id:uid(),title:'Trả lời email khách hàng',date:t,time:'',pri:'low',done:true},
{id:uid(),title:'Nộp hóa đơn điện',date:addDays(t,-2),time:'',pri:'high',done:false},
{id:uid(),title:'Mua quà sinh nhật',date:addDays(t,2),time:'',pri:'mid',done:false},
{id:uid(),title:'Lên kế hoạch chuyến đi',date:addDays(t,4),time:'',pri:'low',done:false}],
rem:[
{id:uid(),title:'Uống thuốc',date:t,time:'20:00',done:false},
{id:uid(),title:'Họp nhóm',date:addDays(t,1),time:'09:30',done:false},
{id:uid(),title:'Gọi cho bố mẹ',date:addDays(t,-1),time:'19:00',done:false}]};S.inc=defInc();save()}
function save(){S._u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.sohoPush)window.sohoPush()}

function when(x){const d=diff(x.date,today());let l,c='';
if(d===0){l='Hôm nay';c='today'}else if(d===1)l='Ngày mai';else if(d===-1){l='Hôm qua';c=x.done?'':'late'}
else if(d<0){l='Quá hạn '+(-d)+' ngày';c=x.done?'':'late'}
else{const dt=new Date(x.date+'T00:00');l=WDS[dt.getDay()]+', '+pad(dt.getDate())+'/'+pad(dt.getMonth()+1)}
if(d<0&&!x.done&&d===-1)l='Quá hạn 1 ngày';
return '<span class="'+c+'">'+l+'</span>'+(x.time?'<span>'+x.time+'</span>':'')}

function item(kind,x){
const tag=kind==='t'&&x.pri!=='low'?'<span class="tag '+x.pri+'">'+PRI[x.pri]+'</span>':'';
return '<div class="item'+(x.done?' done':'')+'"><button class="chk" aria-label="Đánh dấu xong" data-a="tog" data-k="'+kind+'" data-id="'+x.id+'">'+CHECK+'</button><div class="main"><div class="t">'+esc(x.title)+'</div><div class="m">'+when(x)+tag+'</div></div><div class="acts"><button class="ib" data-a="edit" data-k="'+kind+'" data-id="'+x.id+'">Sửa</button><button class="ib" data-a="del" data-k="'+kind+'" data-id="'+x.id+'">Xóa</button></div></div>'}
const list=(kind,a,msg)=>a.length?a.map(x=>item(kind,x)).join(''):'<div class="empty">'+msg+'</div>';

function dashboard(){
const t=today(),h=new Date().getHours(),n=new Date();
const greet=h<11?'Chào buổi sáng':h<18?'Chào buổi chiều':'Chào buổi tối';
const tt=S.tasks.filter(x=>x.date===t).sort((a,b)=>a.done-b.done||cmp(a,b));
const od=S.tasks.filter(x=>x.date<t&&!x.done).sort(cmp);
const rt=S.rem.filter(x=>x.date<=t&&!x.done).sort(cmp);
const open=tt.filter(x=>!x.done).length;
let wk='';for(let i=1;i<=7;i++){const d=addDays(t,i),dt=new Date(d+'T00:00');
const ev=S.tasks.filter(x=>x.date===d).map(x=>({...x,r:0})).concat(S.rem.filter(x=>x.date===d).map(x=>({...x,r:1}))).sort(cmp);
wk+='<div class="day"><div class="dn">'+WDS[dt.getDay()]+'<b>'+dt.getDate()+'/'+(dt.getMonth()+1)+'</b></div>'+ev.map(e=>'<div class="ev'+(e.r?' r':'')+(e.done?' dn2':'')+'">'+(e.time?'<small>'+e.time+'</small>':'')+esc(e.title)+'</div>').join('')+'</div>'}
return '<h1>'+greet+'</h1><p class="sub">'+WD[n.getDay()]+', '+n.getDate()+' tháng '+(n.getMonth()+1)+', '+n.getFullYear()+' · '+(open?'còn '+open+' việc hôm nay':'hôm nay đã xong hết')+(od.length?', '+od.length+' việc quá hạn':'')+'</p>'
+'<div class="grid"><section class="card"><h2>Hôm nay <span class="c">'+tt.length+'</span></h2>'+list('t',tt,'Chưa có việc nào hôm nay. Thêm ở mục Công việc.')+'</section>'

function fnd(n,id,p){if(n.id===id)return{n,p};for(const c of n.c){const r=fnd(c,id,n);if(r)return r}return null}

function lay(m){const sz=new Map(),out=[],rt=m.root,w=n=>Math.max(72,Math.min(240,Math.round(n.t.length*8+32))),hh=n=>n===rt?48:34,ch=n=>n.x?[]:n.c;
if(m.layout==='org'){const sw=n=>{const k=ch(n),s=Math.max(w(n),k.length?k.reduce((a,c)=>a+sw(c),0)+16*(k.length-1):0);sz.set(n,s);return s};
const pv=(n,cx,y,col,par)=>{const nw=w(n),nh=hh(n),r={n,x:cx-nw/2,y,w:nw,h:nh,par,col};out.push(r);let l=cx-sz.get(n)/2;ch(n).forEach((c,j)=>{const cw=sz.get(c);pv(c,l+cw/2,y+nh+44,par?col:j,r);l+=cw+16})};
sw(rt);pv(rt,0,0,-1,null);return out}
const sub=n=>{const k=ch(n),s=Math.max(hh(n),k.length?k.reduce((a,c)=>a+sub(c),0)+10*(k.length-1):0);sz.set(n,s);return s};
const put=(n,x,top,dir,col,par)=>{const nw=w(n),nh=hh(n),cy=top+sz.get(n)/2,px=dir>0?x:x-nw,r={n,x:px,y:cy-nh/2,w:nw,h:nh,par,col};out.push(r);let t=top;ch(n).forEach(c=>{put(c,dir>0?px+nw+36:px-36,t,dir,col,r);t+=sz.get(c)+10})};
sub(rt);const R={n:rt,x:-w(rt)/2,y:-24,w:w(rt),h:48,par:null,col:-1};out.push(R);
const k=ch(rt),h=m.layout==='logic'?k.length:Math.ceil(k.length/2);
const side=(a,dir)=>{let t=-(a.reduce((s,c)=>s+sz.get(c),0)+10*Math.max(0,a.length-1))/2;a.forEach(c=>{put(c,dir>0?R.x+R.w+36:R.x-36,t,dir,k.indexOf(c),R);t+=sz.get(c)+10})};
side(k.slice(0,h),1);side(k.slice(h),-1);return out}
function edges(r,l){return r.filter(a=>a.par).map(a=>{const p=a.par;let d;
if(l==='org'){const sx=p.x+p.w/2,sy=p.y+p.h,ex=a.x+a.w/2,ey=a.y,my=(sy+ey)/2;d='M'+sx+' '+sy+'C'+sx+' '+my+' '+ex+' '+my+' '+ex+' '+ey}
else{const dir=a.x>p.x?1:-1,sx=dir>0?p.x+p.w:p.x,ex=dir>0?a.x:a.x+a.w,sy=p.y+p.h/2,ey=a.y+a.h/2,mx=(sx+ex)/2;d='M'+sx+' '+sy+'C'+mx+' '+sy+' '+mx+' '+ey+' '+ex+' '+ey}

function thumb(m){const r=lay(m),x0=Math.min(...r.map(a=>a.x))-12,y0=Math.min(...r.map(a=>a.y))-12,x1=Math.max(...r.map(a=>a.x+a.w))+12,y1=Math.max(...r.map(a=>a.y+a.h))+12;

const apply=()=>{const c=$('#mc');if(c)c.style.transform='translate('+mv.x+'px,'+mv.y+'px) scale('+mv.k+')'};
function draw(){const m=mm(),mc=$('#mc');if(!m||!mc)return;const r=lay(m);

function fit(){const m=mm(),v=$('#mv');if(!m||!v)return;const r=lay(m),x0=Math.min(...r.map(a=>a.x)),y0=Math.min(...r.map(a=>a.y)),x1=Math.max(...r.map(a=>a.x+a.w)),y1=Math.max(...r.map(a=>a.y+a.h)),W=v.clientWidth,H=v.clientHeight,k=Math.min(1.2,(W-60)/(x1-x0),(H-60)/(y1-y0));
